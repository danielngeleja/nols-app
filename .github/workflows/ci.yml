name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop, staging]

env:
  NODE_VERSION: '22'

permissions:
  contents: read

jobs:
  schema-integrity:
    name: Schema & Migration Integrity
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nolsaf
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: nolsaf_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - name: Checkout code and migration history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: nolsaf/package-lock.json

      - name: Upgrade npm
        run: npm i -g npm@11.6.1

      - name: Install dependencies
        run: npm ci

      - name: Reject edits to migrations already present on the PR base
        if: github.event_name == 'pull_request'
        run: node scripts/check-migration-integrity.mjs --against-git-ref=origin/${{ github.base_ref }}

      - name: Reject edits to migrations already present before this push
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: node scripts/check-migration-integrity.mjs --against-git-ref=${{ github.event.before }}

      - name: Verify migration checksum manifest
        run: npm run migrations:checksums

      - name: Verify Prisma schema has migration coverage
        run: npm run migrations:coverage

      - name: Validate guarded reconciliation against confirmed drift
        run: npm run migration:validate:reconciliation
        env:
          LOCAL_DATABASE_URL: mysql://root:test@127.0.0.1:3306/nolsaf_ci
          SCHEMA_CHECK_ACKNOWLEDGE_DISPOSABLE: local:127.0.0.1:3306/nolsaf_ci

  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nolsaf
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: nolsaf/package-lock.json

      - name: Upgrade npm
        run: npm i -g npm@11.6.1

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Lint API
        run: npm run lint --workspace=@nolsaf/api

      - name: Lint Web
        run: npm run lint --workspace=@nolsaf/web

      - name: Type check API
        run: npm run typecheck --workspace=@nolsaf/api

      - name: Type check Web
        run: npm run typecheck --workspace=@nolsaf/web

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nolsaf
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: nolsaf/package-lock.json

      - name: Upgrade npm
        run: npm i -g npm@11.6.1

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Run API tests
        run: npm run test --workspace=@nolsaf/api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'mysql://test:test@localhost:3306/test' }}

  security:
    name: Production Dependency Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nolsaf
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: nolsaf/package-lock.json

      - name: Upgrade npm
        run: npm i -g npm@11.6.1

      - name: Install dependencies
        run: npm ci

      - name: Reject high-severity production vulnerabilities
        run: npm audit --omit=dev --audit-level=high

  build:
    name: Build Applications
    runs-on: ubuntu-latest
    needs: [schema-integrity, lint-and-typecheck, test, security]
    defaults:
      run:
        working-directory: nolsaf
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: nolsaf/package-lock.json

      - name: Upgrade npm
        run: npm i -g npm@11.6.1

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Build shared packages
        run: npm run --workspace=@nolsaf/shared build

      - name: Build Prisma package
        run: npm run --workspace=@nolsaf/prisma build

      - name: Build API
        run: npm run build --workspace=@nolsaf/api

      - name: Build Web
        run: npm run build --workspace=@nolsaf/web
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:4000' }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            nolsaf/apps/api/dist
            nolsaf/apps/web/.next
          retention-days: 7

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub (if configured)
        if: secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build API Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./nolsaf
          file: ./nolsaf/Dockerfile
          push: false
          tags: nolsaf-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./nolsaf
          file: ./nolsaf/apps/web/Dockerfile
          push: false
          tags: nolsaf-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
